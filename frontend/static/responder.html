<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eSumbong · Responder</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1><a class="brand" href="index.html"><img src="img/logo.svg" alt=""><span><span class="e">e</span>Sumbong</span></a> <span class="section">· Responder / Desk</span></h1>
    <span id="conn" class="conn offline">Not connected</span>
  </header>
  <main>
    <div class="grid">
      <section class="card">
        <h2>Connect</h2>
        <form id="connect-form">
          <div class="row">
            <div>
              <label for="client-id">Your ID (no spaces)</label>
              <input id="client-id" required maxlength="64" pattern="\S+" placeholder="e.g. tanod-jaro-1">
            </div>
            <div>
              <label for="role">Role</label>
              <select id="role">
                <option value="responder">Responder (tanod / captain)</option>
                <option value="desk">City desk</option>
              </select>
            </div>
          </div>
          <div class="row" style="margin-top:.75rem">
            <button type="submit" id="connect-btn">Connect</button>
            <button type="button" id="disconnect-btn" class="secondary" disabled>Disconnect</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Subscriptions</h2>
        <form id="sub-form" class="row">
          <div>
            <label for="pattern">Topic pattern</label>
            <input id="pattern" required placeholder="brgy.jaro.#">
          </div>
          <div style="flex:0 0 auto">
            <button type="submit" id="sub-btn" disabled>Subscribe</button>
          </div>
        </form>
        <p class="meta">* matches one level, # matches the rest. Desk example: city.iloilo.escalated.#</p>
        <ul id="subs" class="list"></ul>
      </section>
    </div>

    <section class="card" style="margin-top:1rem">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">Incoming reports</h2>
        <div class="row" style="flex:0 1 auto">
          <label class="check"><input type="checkbox" id="urgent-only"> Urgent only</label>
          <label class="check"><input type="checkbox" id="hide-resolved"> Hide resolved</label>
        </div>
      </div>
      <ul id="feed" class="list" style="margin-top:.75rem"></ul>
      <p id="feed-empty" class="empty">No reports yet. Subscribe to a topic to start receiving them.</p>
    </section>

    <section class="card" style="margin-top:1rem">
      <h2>Protocol log</h2>
      <div id="log" class="log"></div>
    </section>
  </main>
  <script src="js/sumbong.js"></script>
  <script src="js/responder.js"></script>
</body>
</html>
