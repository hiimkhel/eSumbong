<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eSumbong · Resident</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1><a class="brand" href="index.html"><img src="img/logo.svg" alt=""><span><span class="e">e</span>Sumbong</span></a> <span class="section">· Resident</span></h1>
    <span id="conn" class="conn offline">Not connected</span>
  </header>
  <main class="grid">
    <section class="card">
      <h2>1. Connect</h2>
      <form id="connect-form">
        <label for="client-id">Your ID (no spaces)</label>
        <input id="client-id" required maxlength="64" pattern="\S+" placeholder="e.g. juan-dc">
        <div class="row" style="margin-top:.75rem">
          <button type="submit" id="connect-btn">Connect</button>
          <button type="button" id="disconnect-btn" class="secondary" disabled>Disconnect</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>2. Report an incident</h2>
      <form id="report-form">
        <div class="row">
          <div>
            <label for="barangay">Barangay</label>
            <input id="barangay" required placeholder="e.g. jaro">
          </div>
          <div>
            <label for="purok">Purok</label>
            <input id="purok" required placeholder="e.g. purok-3">
          </div>
        </div>
        <label for="category">Category</label>
        <select id="category" required></select>
        <label for="description">What happened?</label>
        <textarea id="description" required maxlength="500" placeholder="Short description and exact location"></textarea>
        <label class="check"><input type="checkbox" id="anonymous"> Report anonymously</label>
        <p class="meta">Topic: <span id="topic-preview">—</span></p>
        <div class="row">
          <button type="submit" id="report-btn" disabled>Send report</button>
          <button type="button" id="advisory-btn" class="secondary" disabled>Follow barangay advisories</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>My reports</h2>
      <ul id="reports" class="list"></ul>
      <p id="reports-empty" class="empty">No reports yet.</p>
    </section>

    <section class="card">
      <h2>Advisories</h2>
      <ul id="advisories" class="list"></ul>
      <p id="advisories-empty" class="empty">Nothing yet.</p>
    </section>

    <section class="card">
      <h2>Protocol log</h2>
      <div id="log" class="log"></div>
    </section>
  </main>
  <script src="js/sumbong.js"></script>
  <script src="js/resident.js"></script>
</body>
</html>
